[project]
name = "global-pulse"
version = "1.0.0"
description = "API integration dashboard: weather, exchange rates, crypto and Telegram digests"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
